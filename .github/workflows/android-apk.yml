name: Build Android APK

# Manual trigger: GitHub → Actions → "Build Android APK" → Run workflow
# Auto trigger: any tag push like v1.0.1 → builds APK + creates a release
# with the APK as a direct-download asset.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # push ci-logs refs + create the release with the APK
      issues: write     # fallback diagnostics issue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Copy web assets to android (with diagnostics)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG=/tmp/cap.log
          trap '
            echo "=== step finished (exit=$?) — stashing log ===" >> "$LOG" 2>/dev/null || true
            sha=$(git hash-object -w "$LOG" 2>/dev/null) || sha=""
            if [ -n "$sha" ]; then
              git push -q origin "${sha}:refs/ci-logs/${GITHUB_RUN_ID}" 2>>"$LOG" || \
                gh issue create --title "CI: APK build failed — run ${GITHUB_RUN_ID}" --body-file "$LOG" 2>>"$LOG" || true
              echo "log stashed (refs/ci-logs/${GITHUB_RUN_ID} or issue)" >> "$LOG" 2>/dev/null || true
            fi
          ' EXIT
          {
            echo "node: $(node -v 2>&1) | npm: $(npm -v 2>&1)"
            echo "cap binary check:"; ls -la node_modules/.bin/cap 2>&1 || echo "cap binary: MISSING"
            echo "== cap version =="
            ./node_modules/.bin/cap version
            echo "== cap copy android =="
            ./node_modules/.bin/cap copy android
          } > "$LOG" 2>&1
          status=$?
          cat "$LOG"
          exit $status

      - name: Stash failure log (independent)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG=/tmp/cap.log
          if [ -f "$LOG" ]; then
            sha=$(git hash-object -w "$LOG" 2>/dev/null) || sha=""
            if [ -n "$sha" ]; then
              git push -q origin "${sha}:refs/ci-logs/${GITHUB_RUN_ID}-alt" || true
            fi
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK (Gradle)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: battleloop-live-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create release with APK (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          VER="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" "${APK}" \
            --title "BattleLoop Live ${VER} — Android APK" \
            --notes "Direct download: BattleLoop Live v${VER} (debug APK, install on your device). Built by GitHub Actions." \
            --tag "${GITHUB_REF_NAME}" || \
          gh release upload "${GITHUB_REF_NAME}" "${APK}" --clobber
          echo "Direct download link:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/app-debug.apk"
