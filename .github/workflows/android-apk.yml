name: Build Android APK

# Manual trigger: GitHub → Actions → "Build Android APK" → Run workflow
# Auto trigger: any tag push like v1.0.1 → builds APK + creates a release
# with the APK as a direct-download asset.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # push ci-logs refs + create the release with the APK
      issues: write     # fallback diagnostics issue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22   # Capacitor 8 CLI requires Node >= 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Copy web assets to android (with diagnostics)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG=/tmp/cap.log
          trap '
            echo "=== step finished (exit=$?) — stashing log ===" >> "$LOG" 2>/dev/null || true
            sha=$(git hash-object -w "$LOG" 2>/dev/null) || sha=""
            if [ -n "$sha" ]; then
              git push -q origin "${sha}:refs/ci-logs/${GITHUB_RUN_ID}" 2>>"$LOG" || \
                gh issue create --title "CI: APK build failed — run ${GITHUB_RUN_ID}" --body-file "$LOG" 2>>"$LOG" || true
              echo "log stashed (refs/ci-logs/${GITHUB_RUN_ID} or issue)" >> "$LOG" 2>/dev/null || true
            fi
          ' EXIT
          {
            echo "node: $(node -v 2>&1) | npm: $(npm -v 2>&1)"
            echo "cap binary check:"; ls -la node_modules/.bin/cap 2>&1 || echo "cap binary: MISSING"
            echo "== cap copy android =="
            ./node_modules/.bin/cap copy android
          } > "$LOG" 2>&1
          status=$?
          cat "$LOG"
          exit $status

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # @capacitor/android 8.x is compiled with Java 21

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK (Gradle)
        shell: bash
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG=/tmp/gradle.log
          trap '
            echo "=== gradle step finished (exit=$?) — stashing ===" >> "$LOG" 2>/dev/null || true
            sha=$(git hash-object -w "$LOG" 2>/dev/null) || sha=""
            if [ -n "$sha" ]; then
              git push -q origin "${sha}:refs/ci-logs/${GITHUB_RUN_ID}-gradle" 2>>"$LOG" || \
                gh issue create --title "CI: Gradle failed — run ${GITHUB_RUN_ID}" --body-file "$LOG" 2>>"$LOG" || true
              echo "log stashed at refs/ci-logs/${GITHUB_RUN_ID}-gradle" >> "$LOG" 2>/dev/null || true
            fi
          ' EXIT
          ./gradlew assembleDebug --no-daemon --stacktrace > "$LOG" 2>&1
          status=$?
          tail -40 "$LOG"
          exit $status

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: battleloop-live-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create release with APK (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG=/tmp/release.log
          {
            APK=android/app/build/outputs/apk/debug/app-debug.apk
            VER="${GITHUB_REF_NAME#v}"
            echo "APK: $(ls -la "$APK" 2>&1)"
            echo "gh: $(gh --version | head -1)"
            gh auth status 2>&1 || true
            gh release create "${GITHUB_REF_NAME}" "${APK}" \
              --title "BattleLoop Live ${VER} - Android APK" \
              --notes "Direct download: BattleLoop Live v${VER} (debug APK, install on your device). Built by GitHub Actions." \
              --tag "${GITHUB_REF_NAME}" --latest \
              || gh release upload "${GITHUB_REF_NAME}" "${APK}" --clobber
            echo "release cmd exit: $?"
            echo "=== release state ==="
            gh release view "${GITHUB_REF_NAME}" --json url,assets 2>&1 || true
          } > "$LOG" 2>&1
          status=$?
          cat "$LOG"
          sha=$(git hash-object -w "$LOG" 2>/dev/null) || sha=""
          if [ -n "$sha" ]; then git push -q origin "${sha}:refs/ci-logs/${GITHUB_RUN_ID}-release" || true; fi
          if [ "$status" -eq 0 ]; then
            echo "Direct download link:"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/app-debug.apk"
          fi
          exit $status
