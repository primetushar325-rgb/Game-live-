name: Build Android APK

# Manual trigger: GitHub → Actions → "Build Android APK" → Run workflow
# Auto trigger: any tag push like v1.0.1 → builds APK + creates a release
# with the APK as a direct-download asset.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Copy web assets to android (with diagnostics)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "node: $(node -v) | npm: $(npm -v)"
          if [ -x node_modules/.bin/cap ]; then echo "cap binary: present"; else echo "cap binary: MISSING"; fi
          { ./node_modules/.bin/cap version; ./node_modules/.bin/cap copy android; } 2>&1 | tee /tmp/cap.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # stash the full log in a git ref so it can be fetched without log access
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            sha=$(git hash-object -w /tmp/cap.log)
            git update-ref "refs/ci-logs/$GITHUB_RUN_ID" "$sha"
            git push -q origin "refs/ci-logs/$GITHUB_RUN_ID:refs/ci-logs/$GITHUB_RUN_ID" || true
            gh issue create --title "CI: APK build failed — run $GITHUB_RUN_ID" \
              --body "Capacitor copy failed. Log stashed at ref refs/ci-logs/$GITHUB_RUN_ID" || true
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK (Gradle)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: battleloop-live-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create release with APK (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          VER="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" "${APK}" \
            --title "BattleLoop Live ${VER} — Android APK" \
            --notes "Direct download: BattleLoop Live v${VER} (debug APK, install on your device). Built by GitHub Actions." \
            --tag "${GITHUB_REF_NAME}" || \
          gh release upload "${GITHUB_REF_NAME}" "${APK}" --clobber
          echo "Direct download link:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/app-debug.apk"
