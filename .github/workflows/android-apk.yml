name: Build Android APK

# Manual trigger: GitHub → Actions → "Build Android APK" → Run workflow.
# Arena working-branch pushes build an artifact for QA/download; version tags also
# create a release with the APK as a direct-download asset.
on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # push ci-logs refs + create the release with the APK
      issues: write     # fallback diagnostics issue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22   # Capacitor 8 CLI requires Node >= 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Copy web assets to android (with diagnostics)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG=/tmp/cap.log
          trap '
            echo "=== step finished (exit=$?) — stashing log ===" >> "$LOG" 2>/dev/null || true
            sha=$(git hash-object -w "$LOG" 2>/dev/null) || sha=""
            if [ -n "$sha" ]; then
              git push -q origin "${sha}:refs/ci-logs/${GITHUB_RUN_ID}" 2>>"$LOG" || \
                gh issue create --title "CI: APK build failed — run ${GITHUB_RUN_ID}" --body-file "$LOG" 2>>"$LOG" || true
              echo "log stashed (refs/ci-logs/${GITHUB_RUN_ID} or issue)" >> "$LOG" 2>/dev/null || true
            fi
          ' EXIT
          {
            echo "node: $(node -v 2>&1) | npm: $(npm -v 2>&1)"
            echo "cap binary check:"; ls -la node_modules/.bin/cap 2>&1 || echo "cap binary: MISSING"
            echo "== cap copy android =="
            ./node_modules/.bin/cap copy android
          } > "$LOG" 2>&1
          status=$?
          cat "$LOG"
          exit $status

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # @capacitor/android 8.x is compiled with Java 21

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK (Gradle)
        shell: bash
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG=/tmp/gradle.log
          trap '
            echo "=== gradle step finished (exit=$?) — stashing ===" >> "$LOG" 2>/dev/null || true
            sha=$(git hash-object -w "$LOG" 2>/dev/null) || sha=""
            if [ -n "$sha" ]; then
              git push -q origin "${sha}:refs/ci-logs/${GITHUB_RUN_ID}-gradle" 2>>"$LOG" || \
                gh issue create --title "CI: Gradle failed — run ${GITHUB_RUN_ID}" --body-file "$LOG" 2>>"$LOG" || true
              echo "log stashed at refs/ci-logs/${GITHUB_RUN_ID}-gradle" >> "$LOG" 2>/dev/null || true
            fi
          ' EXIT
          ./gradlew assembleDebug --no-daemon --stacktrace > "$LOG" 2>&1
          status=$?
          tail -40 "$LOG"
          exit $status

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: battleloop-live-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The branch artifact is intentionally published for direct installation:
      # the requesting user receives a stable raw GitHub download URL instead
      # of a short-lived Actions artifact URL. [skip ci] prevents a build loop.
      - name: Publish direct APK download (Arena branches)
        if: startsWith(github.ref, 'refs/heads/arena/')
        shell: bash
        run: |
          set -euo pipefail
          DEST="downloads/BattleLoop-Live-v2.1.0-debug.apk"
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$DEST"
          if git diff --cached --quiet; then
            echo "APK is already current; no publish commit needed."
          else
            git commit -m "build: publish BattleLoop Live v2.1.0 APK [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Create release with APK (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG=/tmp/release.log
          trap '
            echo "=== release step finished (exit=$?) — stashing ===" >> "$LOG" 2>/dev/null || true
            sha=$(git hash-object -w "$LOG" 2>/dev/null) || sha=""
            if [ -n "$sha" ]; then
              git push -q origin "${sha}:refs/ci-logs/${GITHUB_RUN_ID}-release" 2>>"$LOG" || true
            fi
          ' EXIT
          {
            set +e
            APK=android/app/build/outputs/apk/debug/app-debug.apk
            VER="${GITHUB_REF_NAME#v}"
            echo "APK: $(ls -la "$APK" 2>&1)"
            echo "gh: $(gh --version 2>&1 | head -1)"
            gh auth status 2>&1 || true
            echo "=== existing releases ==="
            gh release list 2>&1 || true
            echo "=== create release ==="
            gh release create "${GITHUB_REF_NAME}" "${APK}" \
              --title "BattleLoop Live ${VER} - Android APK" \
              --notes "Direct download: BattleLoop Live v${VER} (debug APK). Built by GitHub Actions." \
              --latest
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "create failed (rc=${rc}) - retrying as upload to existing release"
              gh release upload "${GITHUB_REF_NAME}" "${APK}" --clobber
              rc=$?
            fi
            echo "release cmd exit: ${rc}"
            echo "=== release state ==="
            gh release view "${GITHUB_REF_NAME}" --json url,assets 2>&1 || true
            exit "${rc}"
          } > "$LOG" 2>&1
          cat /tmp/release.log 2>/dev/null || true
          exit 1
